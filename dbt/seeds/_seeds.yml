version: 2

seeds:
  - name: publicholiday_dk
    description: "Public holidays in Denmark in the period from 2014-2030 available from the public api: https://date.nager.at/PublicHoliday/Denmark"
    config:
      docs:
        show: true
      column_types:
        Counties: varchar
    columns:
      - name: date
        data_type: date
        description: "The date of the public holiday"
      - name: LocalName
        data_type: string
        description: "The local name of the public holiday"
      - name: Name
        data_type: string
        description: "The name of the public holiday"
      - name: CountryCode
        data_type: string
        description: "The country code of the public holiday"
      - name: Fixed
        data_type: boolean
        description: "Is the public holiday fixed"
      - name: Global
        data_type: boolean
        description: "Is the public holiday global"
      - name: Counties
        data_type: string
        description: "The counties of the public holiday"
